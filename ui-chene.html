<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usage Widget</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono&display=swap');
        
        .font-mono-custom {
            font-family: 'Space Mono', monospace;
        }
    </style>
</head>
<body class=" min-h-screen flex items-center justify-center antialiased">

    <!-- Widget Container -->
    <div class="bg-[#0f0f0f] text-white w-[260px] rounded-2xl p-4 shadow-2xl font-sans border border-neutral-900">
        
        <!-- Header -->
        <div class="flex justify-between items-center mb-5 px-1">
            <!-- Pixel Alien Icon -->
            <svg viewBox="0 0 11 8" class="w-[30px] h-[22px]" fill="#fa6742">
                <rect x="2" y="0" width="1" height="1"/>
                <rect x="8" y="0" width="1" height="1"/>
                <rect x="3" y="1" width="1" height="1"/>
                <rect x="7" y="1" width="1" height="1"/>
                <rect x="2" y="2" width="7" height="1"/>
                <rect x="0" y="3" width="2" height="1"/>
                <rect x="3" y="3" width="1" height="1"/>
                <rect x="7" y="3" width="1" height="1"/>
                <rect x="9" y="3" width="2" height="1"/>
                <rect x="0" y="4" width="11" height="1"/>
                <rect x="0" y="5" width="1" height="1"/>
                <rect x="2" y="5" width="7" height="1"/>
                <rect x="10" y="5" width="1" height="1"/>
                <rect x="0" y="6" width="1" height="1"/>
                <rect x="2" y="6" width="1" height="1"/>
                <rect x="8" y="6" width="1" height="1"/>
                <rect x="10" y="6" width="1" height="1"/>
                <rect x="3" y="7" width="2" height="1"/>
                <rect x="6" y="7" width="2" height="1"/>
            </svg>

            <!-- Title -->
            <h1 class="text-2xl font-serif tracking-wide text-gray-50">Usage</h1>

            
        </div>

        <!-- Current Usage Card -->
        <div class="bg-[#202022] rounded-xl p-3 mb-3 shadow-sm">
            <div class="flex justify-between items-start mb-2">
                <span class="text-[28px] font-bold leading-none tracking-tight">50%</span>
                <span class="bg-[#3e304b] text-[#c2a5dc] text-[11px] font-medium px-2.5 py-1 rounded-full">Current</span>
            </div>
            
            <div class="w-full bg-[#3e304b] h-[10px] rounded-full mt-3 mb-2 overflow-hidden">
                <div class="bg-[#fa6742] h-full rounded-full" style="width: 50%"></div>
            </div>
            
            <div class="text-[12px] text-gray-300 font-medium">
                Resets in 1h 22m
            </div>
        </div>

        <!-- Weekly Usage Card -->
        <div class="bg-[#202022] rounded-xl p-3 mb-2 shadow-sm">
            <div class="flex justify-between items-start mb-2">
                <span class="text-[28px] font-bold leading-none tracking-tight">11%</span>
                <span class="bg-[#3e304b] text-[#c2a5dc] text-[11px] font-medium px-2.5 py-1 rounded-full">Weekly</span>
            </div>
            
            <div class="w-full bg-[#3e304b] h-[10px] rounded-full mt-3 mb-2 overflow-hidden">
                <div class="bg-[#c5e65f] h-full rounded-full" style="width: 11%"></div>
            </div>
            
            <div class="text-[12px] text-gray-300 font-medium">
                Resets in 6d 8h
            </div>
        </div>

        <!-- AI Insight Section -->
        <div id="insight-container" class="bg-[#2a2033] rounded-xl p-3 mb-3 shadow-sm hidden border border-[#3e304b]">
            <p id="insight-text" class="text-sm text-[#c2a5dc] font-sans leading-relaxed"></p>
        </div>
        <!-- Footer -->
        <div class="text-center mt-4 mb-1">
            <span id="footer-text" class="text-[#fa6742] font-mono-custom text-xs font-semibold tracking-wide flex items-center justify-center gap-1.5 transition-all">
                <span class="text-sm mt-0.5">*</span> Musing...
            </span>
        </div>

    </div>

   
</body>
</html>
